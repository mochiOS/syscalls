[workspace]
resolver = "2"
members = [
    "crates/capability-protocol",
    "crates/driver-control-protocol",
    "crates/virtio-gpu-protocol",
    "crates/syscall",
    "crates/runtime",
    "crates/platform",
    "crates/newlib-runtime",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[patch.crates-io]
libc = { path = "../libraries/libc" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
